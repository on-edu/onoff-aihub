<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" width="340" height="180" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="knobGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8FE9FF"/>
      <stop offset="100%" stop-color="#1B3FD9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="340" height="180" rx="90" ry="90" fill="#12141A"/>
  <circle cx="250" cy="90" r="70" fill="url(#knobGrad)" filter="url(#glow)"/>
</svg>
