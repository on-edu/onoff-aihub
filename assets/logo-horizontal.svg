<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="knobGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8FE9FF"/>
      <stop offset="100%" stop-color="#1B3FD9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- icon: toggle switch mark -->
  <g transform="translate(16, 35)">
    <rect x="0" y="0" width="170" height="90" rx="45" ry="45" fill="#12141A"/>
    <circle cx="125" cy="45" r="35" fill="url(#knobGrad)" filter="url(#glow)"/>
  </g>

  <!-- wordmark -->
  <text x="212" y="103" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="800" font-size="72" letter-spacing="-2">
    <tspan fill="#1B3FD9">On</tspan><tspan fill="#8A8F9C">Off</tspan>
  </text>
  <text x="212" y="140" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-weight="700" font-size="26" letter-spacing="1" fill="#8A8F9C">
    AI EDUCATION
  </text>
</svg>
