<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 신청 | OnOff</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FB; --surface:#FFFFFF; --ink:#12141A; --ink-soft:#5B6272;
    --on:#2E5BFF; --on-glow:#6FE0FF; --off:#C7CCD6; --off-soft:#EEF0F4; --line:#E3E6EE;
    --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ background:var(--bg); color:var(--ink); font-family:'Pretendard',-apple-system,sans-serif; line-height:1.5; }
  .mono{ font-family:'JetBrains Mono',monospace; }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:640px; margin:0 auto; padding:0 24px; }

  header{ padding:28px 0; border-bottom:1px solid var(--line); }
  .logo{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:19px; }
  .logo-switch{ width:32px; height:17px; border-radius:99px; background:var(--ink); position:relative; }
  .logo-switch::after{ content:''; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:var(--on-glow); }
  .back-link{ font-size:13.5px; color:var(--ink-soft); font-weight:600; display:flex; align-items:center; gap:6px; margin-top:14px; }
  .back-link:hover{ color:var(--on); }

  main{ padding:56px 0 100px; }
  .eyebrow{ font-size:13px; font-weight:700; color:var(--on); margin-bottom:14px; }
  h1{ font-size:clamp(28px,4vw,38px); font-weight:800; letter-spacing:-0.02em; }
  .sub{ margin-top:14px; color:var(--ink-soft); font-size:15.5px; max-width:46ch; }

  form{ margin-top:44px; display:flex; flex-direction:column; gap:22px; }
  .field label{ display:block; font-size:13.5px; font-weight:700; margin-bottom:8px; }
  .field .req{ color:var(--on); margin-left:2px; }
  .field input, .field select, .field textarea{
    width:100%; padding:13px 15px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); font-family:inherit; font-size:14.5px; color:var(--ink);
    transition:border-color .2s, box-shadow .2s;
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none; border-color:var(--on); box-shadow:0 0 0 3px rgba(46,91,255,0.12);
  }
  .field textarea{ resize:vertical; min-height:140px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:560px){ .row2{ grid-template-columns:1fr; } }

  .submit-btn{
    margin-top:10px; padding:16px 24px; border-radius:99px; border:none; cursor:pointer;
    background:var(--on); color:#fff; font-weight:700; font-size:15.5px;
    display:flex; align-items:center; justify-content:center; gap:8px; transition:background .2s, transform .2s;
  }
  .submit-btn:hover{ background:var(--on-glow); color:#0d1117; transform:translateY(-1px); }

  .notice{
    margin-top:18px; padding:14px 16px; border-radius:12px; background:var(--off-soft);
    font-size:13px; color:var(--ink-soft); line-height:1.6;
  }
  .notice b{ color:var(--ink); }

  .confirm{
    display:none; margin-top:28px; padding:20px; border-radius:14px;
    background:#EEF3FF; border:1px solid rgba(46,91,255,0.25); color:var(--on);
    font-size:14.5px; font-weight:600;
  }
  .confirm.show{ display:block; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="logo"><span class="logo-switch"></span>OnOff</a>
    <a href="index.html" class="back-link">← 홈으로 돌아가기</a>
  </div>
</header>

<main class="wrap">
  <div class="eyebrow mono">CONSULTATION</div>
  <h1>도입 상담 신청</h1>
  <p class="sub">아래 내용을 작성해 보내주시면, 담당자가 확인 후 빠르게 연락드립니다.</p>

  <form id="consultForm">
    <div class="row2">
      <div class="field">
        <label for="name">담당자 성함<span class="req">*</span></label>
        <input type="text" id="name" name="name" required placeholder="홍길동">
      </div>
      <div class="field">
        <label for="org">기관/학교명<span class="req">*</span></label>
        <input type="text" id="org" name="org" required placeholder="OO초등학교">
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label for="phone">연락처<span class="req">*</span></label>
        <input type="tel" id="phone" name="phone" required placeholder="010-0000-0000">
      </div>
      <div class="field">
        <label for="email">회신받을 이메일<span class="req">*</span></label>
        <input type="email" id="email" name="email" required placeholder="example@email.com">
      </div>
    </div>

    <div class="field">
      <label for="interest">관심 분야</label>
      <select id="interest" name="interest">
        <option value="코딩·로봇교육">코딩·로봇교육</option>
        <option value="AR·VR, 메이커">AR·VR, 메이커</option>
        <option value="기자재">기자재</option>
        <option value="공간구축">공간구축</option>
        <option value="쇼핑몰">쇼핑몰</option>
        <option value="전체/잘 모르겠음">전체 / 잘 모르겠음</option>
      </select>
    </div>

    <div class="field">
      <label for="message">상담 내용<span class="req">*</span></label>
      <textarea id="message" name="message" required placeholder="문의하실 내용을 자유롭게 작성해주세요. (예: 대상 학년, 희망 시기, 예산 범위 등)"></textarea>
    </div>

    <button type="submit" class="submit-btn">상담 신청 보내기 →</button>

    <div class="notice">
      <b>안내</b> · 전송 버튼을 누르면 작성하신 내용을 담아 이메일 앱이 열립니다. 그대로 <b>보내기</b>를 눌러주셔야 abc@naver.com으로 최종 접수됩니다.
    </div>

    <div class="confirm" id="confirmBox">
      이메일 작성 화면이 열렸어요. 내용을 확인하시고 <b>보내기</b> 버튼을 눌러 상담 신청을 완료해주세요.
    </div>
  </form>
</main>

<script>
  const form = document.getElementById('consultForm');
  const confirmBox = document.getElementById('confirmBox');

  form.addEventListener('submit', function(e){
    e.preventDefault();

    const data = {
      name: form.name.value.trim(),
      org: form.org.value.trim(),
      phone: form.phone.value.trim(),
      email: form.email.value.trim(),
      interest: form.interest.value,
      message: form.message.value.trim()
    };

    const subject = `[상담신청] ${data.org} - ${data.name}`;
    const body =
`■ 담당자 성함: ${data.name}
■ 기관/학교명: ${data.org}
■ 연락처: ${data.phone}
■ 회신 이메일: ${data.email}
■ 관심 분야: ${data.interest}

■ 상담 내용
${data.message}`;

    const mailto = `mailto:abc@naver.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    window.location.href = mailto;

    confirmBox.classList.add('show');
  });
</script>

</body>
</html>
